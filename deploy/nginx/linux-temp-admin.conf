location = /404.html {
    internal;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /linux-temp-admin {
    gzip off;
    error_page 404 = @linux_temp_admin_not_found;
    return 404;
}

location = /linux-temp-admin/latest.json {
    default_type application/json;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET {
        deny all;
    }
    try_files $uri @linux_temp_admin_not_found;
}

location = /linux-temp-admin/install.sh {
    default_type text/plain;
    charset utf-8;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET {
        deny all;
    }
    try_files $uri @linux_temp_admin_not_found;
}

location ~ ^/linux-temp-admin/v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?/(?:SHA256SUMS|linux-temp-admin-linux-(?:amd64|arm64)(?:\.sig)?|install\.sh)$ {
    default_type application/octet-stream;
    gzip off;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET {
        deny all;
    }
    try_files $uri @linux_temp_admin_not_found;
}

location ~ ^/linux-temp-admin/ {
    autoindex off;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @linux_temp_admin_not_found;
    limit_except GET {
        deny all;
    }
    return 404;
}

location @linux_temp_admin_not_found {
    default_type text/plain;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
